<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Some feelings deserve more than a message.</title>
  <style>
    :root { --ink:#241b23; --paper:#fffafb; --rose:#d6a8b5; --muted:#765e68; --line:#eadde1; --bg:#191923; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 15% 10%, #3c2c42 0 18%, transparent 40%), var(--bg); font-family:Arial,sans-serif; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; border:0; }
    .app { min-height:100vh; padding:24px; }
    .topbar { max-width:1120px; margin:auto; display:flex; align-items:center; justify-content:space-between; color:#f8edf0; }
    .brand { font-weight:700; letter-spacing:-.03em; font-size:18px; }
    .brand span { color:var(--rose); margin-right:8px; }
    .topbar button { background:none; color:#f8edf0; opacity:.85; }
    .screen { max-width:1120px; margin:0 auto; padding:72px 0; }
    .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:72px; align-items:center; }
    .eyebrow { color:var(--rose); text-transform:uppercase; font-size:11px; letter-spacing:.18em; font-weight:bold; }
    h1,h2,h3 { font-family:Georgia,serif; font-weight:400; letter-spacing:-.06em; }
    h1 { color:#fff8f1; font-size:clamp(48px,8vw,94px); line-height:.92; margin:16px 0 24px; }
    h2 { font-size:clamp(36px,5vw,64px); margin:12px 0 18px; }
    p { line-height:1.7; color:#d8cbd0; max-width:520px; }
    .primary { background:var(--rose); color:#241b23; border-radius:999px; padding:14px 22px; font-weight:bold; transition:.2s; }
    .primary:hover { transform:translateY(-2px); box-shadow:0 10px 24px #0005; }
    .ghost { color:#f8edf0; background:transparent; border:1px solid #ffffff30; border-radius:999px; padding:13px 20px; }
    .hero-actions { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; }
    .envelope-wrap { animation:float 4s ease-in-out infinite; }
    .envelope { position:relative; width:min(100%,480px); aspect-ratio:1.45; margin:auto; filter:drop-shadow(0 26px 18px #0006); }
    .env-body { position:absolute; inset:15% 0 0; background:#fff6ed; border:2px solid #f2c7ad; border-radius:14px; overflow:hidden; }
    .env-body:after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,transparent 49%,#f8ddca 50%,transparent 51%),linear-gradient(225deg,transparent 49%,#f8ddca 50%,transparent 51%); }
    .flap { position:absolute; z-index:2; left:0; right:0; top:15%; height:54%; background:#f6c29a; clip-path:polygon(0 0,100% 0,50% 100%); border-radius:14px 14px 0 0; }
    .seal { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); width:62px; height:62px; border-radius:50%; background:#c88c9a; color:#241b23; display:grid; place-items:center; font-size:24px; box-shadow:0 8px 18px #7a4c5c55; }
    @keyframes float { 50% { transform:translateY(-9px) rotate(.5deg); } }
    .panel { background:#f8f2f3; border-radius:28px; padding:clamp(24px,5vw,58px); max-width:760px; margin:auto; }
    .panel p { color:var(--muted); }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:block; color:var(--muted); font-size:13px; font-weight:bold; margin-bottom:8px; }
    input,textarea { width:100%; border:1px solid #decdd3; background:#fffafb; color:var(--ink); border-radius:12px; padding:14px; outline:none; }
    textarea { resize:vertical; min-height:220px; line-height:1.7; }
    input:focus,textarea:focus { border-color:#c88c9a; box-shadow:0 0 0 3px #c88c9a33; }
    .field { margin-top:18px; }
    .themes { display:flex; gap:10px; flex-wrap:wrap; }
    .theme { border:2px solid transparent; padding:12px 18px; border-radius:12px; color:var(--ink); }
    .theme.active { border-color:#241b23; box-shadow:0 0 0 3px #c88c9a55; }
    .theme[data-theme=peach] { background:#ffd8b4; }
    .theme[data-theme=pink] { background:#f4bfdc; }
    .theme[data-theme=black] { color:#fff; background:#292333; }
    .submit { width:100%; margin-top:26px; font-size:16px; }
    .hint { font-size:12px; color:#8c737c; margin-top:8px; }
    .ready { text-align:center; }
    .sharebox { display:flex; gap:8px; margin:26px auto; max-width:580px; }
    .sharebox input { background:#fff; }
    .letter-stage { text-align:center; }
    .letter-stage .envelope { max-width:560px; margin:40px auto 28px; }
    .open-note { color:#d8cbd0; }
    .paper { text-align:left; background:var(--paper); max-width:720px; margin:30px auto; padding:clamp(28px,7vw,72px); border-radius:7px; box-shadow:0 20px 55px #0007; position:relative; overflow:hidden; }
    .paper:before { content:""; position:absolute; inset:0; opacity:.32; background:repeating-linear-gradient(to bottom,transparent 0 31px,#e5cdd3 32px); pointer-events:none; }
    .paper > * { position:relative; }
    .paper.peach { background:#fff0df; }
    .paper.pink { background:#ffeaf4; }
    .paper.black { background:#272331; color:#fff4f6; }
    .paper.black:before { background:repeating-linear-gradient(to bottom,transparent 0 31px,#5c4654 32px); }
    .paper-meta { display:flex; justify-content:space-between; color:#765e68; font-size:13px; margin-bottom:50px; }
    .black .paper-meta { color:#d6a8b5; }
    .paper h2 { font-size:clamp(34px,6vw,58px); margin-bottom:38px; }
    .paper-body { white-space:pre-wrap; font-family:Georgia,serif; font-size:clamp(18px,3vw,23px); line-height:1.8; min-height:160px; }
    .music { display:flex; align-items:center; gap:12px; justify-content:center; color:#d6a8b5; font-size:13px; margin-top:20px; }
    .music button { background:#d6a8b5; color:#241b23; border-radius:50%; width:38px; height:38px; }
    .error { background:#ffdfe3; color:#852f43; padding:16px; border-radius:12px; margin-top:16px; }
    .hidden { display:none !important; }
    @media (max-width:720px) {
      .app { padding:18px; }
      .screen { padding:52px 0; }
      .hero { grid-template-columns:1fr; gap:48px; }
      .hero-copy { order:2; }
      .envelope-wrap { order:1; }
      .form-grid { grid-template-columns:1fr; }
      .sharebox { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" onclick="home()"><span>◒</span> Letter</button>
      <button onclick="showCreate()">Create a letter</button>
    </header>
    <main id="root"></main>
  </div>
  <script>
    const root = document.getElementById("root");
    const themes = { peach:"#ffd8b4", pink:"#f4bfdc", black:"#292333" };
    let selectedTheme = "pink";

    function home() {
      root.innerHTML = `<section class="screen hero">
        <div class="hero-copy"><div class="eyebrow">A little place for big feelings</div>
        <h1>Say it with a letter they can keep.</h1>
        <p>Create a beautiful, private letter and give someone a moment they’ll want to open again and again.</p>
        <div class="hero-actions"><button class="primary" onclick="showCreate()">Write a letter →</button><button class="ghost" onclick="showCreate()">Private by design</button></div></div>
        <div class="envelope-wrap"><div class="envelope" onclick="showCreate()" aria-label="Create a letter"><div class="env-body"></div><div class="flap"></div><div class="seal">⌄</div></div></div>
      </section>`;
    }

    function showCreate() {
      selectedTheme = "pink";
      root.innerHTML = `<section class="screen"><div class="panel"><div class="eyebrow">Make something personal</div><h2>Write from the heart.</h2><p>Fill in the little details. When you’re ready, we’ll turn it into a letter they can open.</p>
        <form onsubmit="createLetter(event)">
          <div class="form-grid"><div class="field"><label for="from">From</label><input id="from" required maxlength="120" placeholder="Your name"></div><div class="field"><label for="to">To</label><input id="to" required maxlength="120" placeholder="Their name"></div></div>
          <div class="field"><label for="content">Your letter</label><textarea id="content" required maxlength="10000" placeholder="Dear you,..."></textarea></div>
          <div class="field"><label>Choose a paper</label><div class="themes">${Object.keys(themes).map(t=>`<button type="button" class="theme ${t==="pink"?"active":""}" data-theme="${t}" onclick="pickTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div>
          <div class="field"><label for="music">Add a song from your device</label><input id="music" type="file" accept=".mp3,audio/mpeg,audio/mp3"><div class="hint">Choose an MP3 file. It will play once the letter is opened.</div></div>
          <div id="formError"></div><button class="primary submit" type="submit">CREATE LETTER</button>
        </form></div></section>`;
    }

    function pickTheme(theme) {
      selectedTheme = theme;
      document.querySelectorAll(".theme").forEach(b=>b.classList.toggle("active", b.dataset.theme===theme));
    }

    function encode(data) { return btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replaceAll("+","-").replaceAll("/","_").replaceAll("=",""); }
    function decode(value) { return JSON.parse(decodeURIComponent(escape(atob(value.replaceAll("-","+").replaceAll("_","/")+"=".repeat((4-value.length%4)%4))))); }

    function createLetter(event) {
      event.preventDefault();
      const fileInput = document.getElementById("music");
      const file = fileInput.files[0];

      if (file && file.type !== "audio/mpeg" && file.type !== "audio/mp3" && !file.name.toLowerCase().endsWith(".mp3")) {
        document.getElementById("formError").innerHTML = `<div class="error">Please choose an MP3 file.</div>`;
        return;
      }

      const finish = (music) => {
        const data = {
          id: crypto.randomUUID ? crypto.randomUUID().slice(0,12) : Math.random().toString(36).slice(2,14),
          from: document.getElementById("from").value.trim(),
          to: document.getElementById("to").value.trim(),
          content: document.getElementById("content").value.trim(),
          theme: selectedTheme,
          music: music || null,
          createdAt: new Date().toISOString()
        };

        const link = location.href.split("#")[0] + "#letter=" + encode(data);
        try { localStorage.setItem("lovee-"+data.id, JSON.stringify(data)); } catch {}

        root.innerHTML = `<section class="screen"><div class="panel ready"><div class="eyebrow">It’s ready</div><h2>Your letter is ready!</h2><p>Copy this link and send it to ${escapeHtml(data.to)}. They’ll find a little surprise waiting.</p><div class="sharebox"><input id="shareLink" readonly value="${link}"><button class="primary" onclick="copyLink()">Copy link</button></div><button class="ghost" style="color:#241b23;border-color:#241b2344" onclick="home()">Create another</button></div></section>`;
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => finish(e.target.result);
        reader.readAsDataURL(file);
      } else {
        finish(null);
      }
    }

    function copyLink() {
      const input = document.getElementById("shareLink");
      input.select();
      navigator.clipboard?.writeText(input.value);
      event.target.textContent = "Copied!";
      setTimeout(()=>event.target.textContent="Copy link",1500);
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    function showLetter(data) {
      window.currentLetter = data;
      root.innerHTML = `<section class="screen letter-stage"><div class="eyebrow">Someone left you a letter</div><h2>You have mail.</h2><div class="envelope" onclick="openLetter()" role="button" tabindex="0" aria-label="Open letter"><div class="env-body" style="background:${themes[data.theme]||themes.pink}"></div><div class="flap" style="background:${themes[data.theme]||themes.pink}"></div><div class="seal">⌄</div></div><div class="open-note">Tap the envelope to open it</div></section>`;
    }

    function openLetter() {
      const d = window.currentLetter;
      root.innerHTML = `<section class="screen letter-stage"><div class="paper ${d.theme}"><div class="paper-meta"><span>For ${escapeHtml(d.to)}</span><span>With love</span></div><h2>Dear <span id="typedName"></span>,</h2><div class="paper-body" id="typedBody"></div><div class="paper-meta" style="margin:50px 0 0"><span>Always,</span><span>${escapeHtml(d.from)}</span></div></div>${d.music?`<div class="music"><button onclick="toggleMusic()" id="musicButton">▶</button><span id="musicText">Music for this moment</span><audio id="player" class="hidden" loop preload="auto"></audio></div>`:""}</section>`;
      typeText("typedName", d.to, 55, () => typeText("typedBody", d.content, 24));
      if (d.music) startMusic(d.music);
    }

    function typeText(id, text, speed, done) {
      let i = 0, el = document.getElementById(id);
      const tick = () => {
        if (i < text.length) { el.textContent += text[i++]; setTimeout(tick, speed); }
        else if (done) done();
      };
      tick();
    }

    function startMusic(url) {
      const player = document.getElementById("player");
      const button = document.getElementById("musicButton");
      const text = document.getElementById("musicText");
      if (!player || !url) return;

      player.src = url;
      player.loop = true;

      player.play().then(() => {
        button.textContent = "Ⅱ";
        text.textContent = "Music is playing";
      }).catch(() => {
        button.textContent = "▶";
        text.textContent = "Tap to play";
      });
    }

    function toggleMusic() {
      const player = document.getElementById("player");
      const button = document.getElementById("musicButton");
      const text = document.getElementById("musicText");
      if (!player) return;

      if (player.paused) {
        player.play().then(() => {
          button.textContent = "Ⅱ";
          text.textContent = "Music is playing";
        });
      } else {
        player.pause();
        button.textContent = "▶";
        text.textContent = "Music paused";
      }
    }

    function route() {
      if (location.hash.startsWith("#letter=")) {
        try { showLetter(decode(location.hash.slice(8))); }
        catch {
          root.innerHTML = `<section class="screen"><div class="panel"><h2>Letter not found.</h2><p>This link may be incomplete or expired.</p><button class="primary" onclick="home()">Go home</button></div></section>`;
        }
      } else home();
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
